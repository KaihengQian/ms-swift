name: funeval
channels:
  - defaults
dependencies:
  # conda 层只装 Python 与基础工具；其余依赖走 pip（见下方 pip 段与 requirements.txt）
  - python=3.11
  - pip=26.2.2
  - setuptools=84.2.1
  - ca-certificates=2026.10.20
  - openssl=3.5.9
  - pip:
      # 完整锁定清单见同目录 requirements.txt（funeval 环境 pip freeze）
      # 关键版本：torch 2.9.1+cu128 / torchvision 0.24.1 / transformers 4.57.3 /
      #          peft 0.18.1 / accelerate 1.12.0 / numpy 2.3.5 / qwen-vl-utils 0.0.14 / Pillow 12.0.0
      - -r requirements.txt
      # 评测框架随本仓库提供：
      #   pip install -e <本目录>/funembed_eval
